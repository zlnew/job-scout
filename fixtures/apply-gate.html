<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Gated application form</title></head>
  <body>
    <div id="consent" data-ui="cookie-consent" aria-label="Cookie Consent">
      This site uses cookies. <button type="button" onclick="document.getElementById('consent').remove();">Accept all</button>
    </div>
    <h1>Apply for Backend Engineer</h1>
    <form id="app" onsubmit="event.preventDefault(); document.body.dataset.submitted = '1';">
      <button id="gate" type="button" onclick="document.getElementById('panel').hidden = false;">Apply for this job</button>
      <div id="panel" hidden>
        <label for="full">Full name</label><input id="full" type="text" />
        <label for="mail">Email</label><input id="mail" type="email" />
        <label for="cl">Cover letter</label><textarea id="cl" name="cover_letter"></textarea>
        <button type="submit">Submit application</button>
      </div>
    </form>
  </body>
</html>
